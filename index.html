<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Club 27</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  :root{
    --bg: #14100d;
    --panel: #1d1712;
    --panel-edge: #2c2118;
    --gold: #c6a15b;
    --gold-bright: #ecc87f;
    --wine: #6e1f2b;
    --cream: #ede3ce;
    --muted: #9c8f72;
    --danger: #c0524a;
  }

  *{ box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  body{
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(198,161,91,0.10), transparent 55%),
      radial-gradient(ellipse at 50% 110%, rgba(0,0,0,0.6), transparent 60%),
      repeating-linear-gradient(90deg, rgba(198,161,91,0.035) 0px, rgba(198,161,91,0.035) 1px, transparent 1px, transparent 64px),
      var(--bg);
    color: var(--cream);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 18px;
  }

  .stage-track{
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .tab{
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    padding: 5px 10px 6px;
    border: 1px dashed var(--panel-edge);
    color: var(--muted);
    border-radius: 2px;
    transition: all 0.4s ease;
  }
  .tab.done{
    border-style: solid;
    border-color: var(--gold);
    background: var(--wine);
    color: var(--gold-bright);
    cursor: pointer;
  }
  .tab.done:hover{
    background: #8a2b39;
    box-shadow: 0 0 0 3px rgba(198,161,91,0.15);
  }
  .tab.current{
    cursor: pointer;
    border-style: solid;
    border-color: var(--gold-bright);
    color: var(--cream);
    box-shadow: 0 0 0 3px rgba(198,161,91,0.15);
  }
  .tab.current:hover{
    box-shadow: 0 0 0 3px rgba(198,161,91,0.25);
  }
  .tab.locked{
    cursor: not-allowed;
    opacity: 0.55;
  }

  .card{
    width: 100%;
    max-width: 440px;
    background: linear-gradient(180deg, var(--panel), #191410);
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    padding: 40px 34px 34px;
    position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.03);
  }

  .card::before{
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(198,161,91,0.25);
    border-radius: 2px;
    pointer-events: none;
  }

  .ornament{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .ornament .line{
    height: 1px;
    width: 44px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .ornament .line.right{ background: linear-gradient(90deg, var(--gold), transparent); }
  .ornament .diamond{
    width: 8px; height: 8px;
    background: var(--gold);
    transform: rotate(45deg);
  }

  h1{
    font-family: 'Cinzel', serif;
    font-weight: 600;
    text-align: center;
    letter-spacing: 0.28em;
    font-size: 30px;
    margin: 6px 0 2px;
    color: var(--gold-bright);
    text-shadow: 0 0 24px rgba(198,161,91,0.25);
  }

  .subtitle{
    text-align: center;
    font-size: 12.5px;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 30px;
  }

  /* --- Wax seal signature element --- */
  .seal-wrap{
    display: flex;
    justify-content: center;
    margin: 4px 0 26px;
    height: 78px;
    position: relative;
  }
  .seal{
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8a2b39, var(--wine) 65%, #4c141d 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-size: 22px;
    color: var(--gold-bright);
    box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.15), inset 0 -3px 6px rgba(0,0,0,0.4);
    transition: transform 0.7s cubic-bezier(.36,1.4,.4,1), opacity 0.7s ease;
    position: absolute;
  }
  .seal.cracked{
    transform: scale(0.4) rotate(35deg) translateY(-6px);
    opacity: 0;
  }

  form{
    transition: opacity 0.3s ease;
  }

  label{
    display: block;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    text-align: center;
  }

  .input-row{
    display: flex;
    gap: 8px;
  }

  input[type="text"], input[type="password"]{
    flex: 1;
    background: #100c09;
    border: 1px solid var(--panel-edge);
    color: var(--cream);
    font-family: 'Jost', sans-serif;
    font-size: 15px;
    letter-spacing: 0.08em;
    padding: 12px 14px;
    border-radius: 2px;
    outline: none;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  input:focus{
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(198,161,91,0.15);
  }

  button{
    background: var(--gold);
    color: #1a1410;
    border: none;
    font-family: 'Cinzel', serif;
    font-weight: 600;
    letter-spacing: 0.08em;
    font-size: 13px;
    padding: 0 22px;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  button:hover{ background: var(--gold-bright); }
  button:active{ transform: translateY(1px); }

  .feedback{
    min-height: 20px;
    text-align: center;
    font-size: 12.5px;
    letter-spacing: 0.05em;
    margin-top: 14px;
    color: var(--danger);
  }

  .hint-area{
    text-align: center;
    margin-top: 6px;
  }
  .hint-toggle{
    background: none;
    border: none;
    padding: 0;
    color: var(--muted);
    font-family: 'Jost', sans-serif;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-decoration: underline dotted;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .hint-toggle:hover{ color: var(--gold-bright); }
  .hint-text{
    display: none;
    margin-top: 10px;
    font-size: 13px;
    font-style: italic;
    color: var(--gold-bright);
    line-height: 1.5;
    padding: 0 6px;
  }

  @keyframes shake{
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  .shake{ animation: shake 0.5s ease; }

  /* Added while the on-screen keyboard is open (see JS below) so there's
     always extra room underneath the input for the browser to scroll to —
     without this, phones have nothing to scroll to and the keyboard just
     covers the input instead. */
  body.keyboard-open{
    padding-bottom: 50vh;
  }

  .note{
    background: #efe6cf;
    color: #2a2117;
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    padding: 24px 22px;
    border-radius: 2px;
    line-height: 1.6;
    font-size: 15px;
    white-space: pre-line;
    box-shadow: 0 14px 34px rgba(0,0,0,0.35);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.6s ease 0.15s, transform 0.6s ease 0.15s;
    position: relative;
  }
  .note::before{
    content: "";
    position: absolute;
    top: -6px; left: 18px; right: 18px;
    height: 6px;
    background: repeating-linear-gradient(90deg, transparent 0 6px, rgba(0,0,0,0.12) 6px 8px);
  }
  .note.shown{
    opacity: 1;
    transform: translateY(0);
  }
  .note .eyebrow{
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--wine);
    margin-bottom: 8px;
    display: block;
  }

  .continue-btn{
    display: block;
    margin: 20px auto 0;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold-bright);
  }
  .continue-btn:hover{ background: rgba(198,161,91,0.12); }

  .final{
    text-align: center;
  }
  .final .eyebrow{
    color: var(--gold);
  }

  footer{
    text-align: center;
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-top: 26px;
  }

</style>
</head>

  <div style="width:100%; max-width:440px;">

<script>

  /* ====================================================================
     EDIT ME: add, remove, or rewrite stages here.

    {

      ciphertext: "AUCE02K6V+D1DRyopeFgofbyw4ehrye5+jLh6QfjjLmU7285SxS3CWsxQxJdNUst7WrafLmc6VBPz9bCQn0YbwAAeYdHmGYSd1pCi9VzK8+1XNvRnzpglB9wB694uoFDBeMd8bh1CsuGmAbLJKK06X4opIIR29h1xnRH25l7imrbXXGejuP2O9UehTdle5kt7lXnGSI3mjY+2vPGUvIZN5+QgiWD6Rb75/XKneD/mYGQZW3Kr2D38FSTCO9fEfJi5jwRFDZB/Y0l5ahOfKCHarvB1jdZXlHthMIAwzzODKHAAJ+W0OpTPwo6YkOvsPNUarZupbgGJCB4xuYD58/xRmiEe/Gps5HgkYMkSDeckbiW12PGYtp0w1nlyJqmeEwFPb6hjTlU757ZOJ3v8gvZXBCtYTuq4Sf+72vTC+bXPHZWb9r2ASwH+tS/01tDmxtqZeu8sF9U0TExUUDsLUbZKB69BevV4qoNmMA0rV87dhDw86HqEpgg6xuVJc7TqaXDnpnGW2Y2NNe3PWGfF25tQXSJYoecv8YbEVNctk7tIZLuG4zumq87a0sI+oxX5P0KrbqAZWMr1ltBlCOfMw3ZVcU56fySOiQo25hquWB9zT81G0tAE8p6+I8Tcpp6sqLwfAdE6yTajPBX3MUsibZiJ/ak0jiEBzWpFVBydikpZBmdE/z0Dvmx65rzQ/uvJ5gTirBMmf46JpD6P93aw5KZ3v8KQqVDeuu1/afQp0tZLskkXe6zeFNc2Q7SzAj1ij0vKXCxyKkMHtqR+77CdvUoRIygPuuRWvJJCYQlOrLguplfvlwCFL/Wp8nd4AVvKBjJ2dCxaCwbSDzIrKJNhUVqHvvp6p+H3BbHLNweGM1iP+VeYv/xP7VYQAn655uDJR2Zfl0aRPqaFHx8zdTpdJC31VcIA1h0l/X7C5bAAqDEi6OCbKcX6kv7u470zfbIG+iNmyCF8Dv1eZNmTdp+jpGHp+6vAuaVzrc93zIvvcx1TxzLtpKJKUyqQ42VNcorv0hEPu3DMATuzuiNS1kc9UiTUwdnNUgWa5Y/S+5OVSZbTkzsg4fJEB5hbz5zryoEIqMg/k/OG2/A8f6dDrol28c2rlZvJ6shU4OzBpaHhcfZph0=",
      hint: "Portez une attention paritculière aux ingrédients."
    },
    {
      salt: "zjD3nknLdEHr+W4jSVTxiQ==",
      iv: "sB5uLzDj3VR2ST0O",
      ciphertext: "MulkmLKg7yDJ/+YQm56BLen05dxL2jQ/L1bYtTBI/hQdN17TCeYMPhXGyETcK/q4aepCbUp6uZbueJn3OkrSlFaz8UWuWiJVNgPax06HMIn/JRrskbkl6O+EKJuny3bt0hNmzCyPj9U/j/5SVDn4IeZJja0XtXR2Tr+PFd7HIp1Omw9UCmYeektvu6Uw/Hc=",
      hint: "Entrez les numéros des fournisseurs un à la suite de l'autre (sans espace ni virgule) dans le bon ordre."
    },
    {
      salt: "Pagrc4wimGmCSQF4+cXi1g==",
      iv: "Rr562fr7K4BtA/sd",
      ciphertext: "VPh5k3MUUrbXxuLyaZ3ozFiLOidUMzcsHINbiBVBs04J6fOIeYGt0YsM",
      hint: "en minuscule. Si ça ne fonctionne pas, écrivez le dans l'autre sense!"
    },
    {
      salt: "B25HTmYBjP0fpi6tEEN+Uw==",
      iv: "l7ltfrIQiIt4+req",
      ciphertext: "OC0aeZcXfLs2Qa5IHeq6fg==",
      hint: ""
    }
  ];
  // ===STAGES_END===

  // Must match the ITERATIONS constant in build_stages.py exactly.
  const PBKDF2_ITERATIONS = 250000;

  function b64ToBytes(b64){
    return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  }

  // Tries to decrypt this stage's clue using the guessed password.
  // Resolves with the clue text if the password was right.
  // Throws if the password was wrong (AES-GCM's built-in check fails).
  async function tryUnlock(stageData, guess){
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(guess), { name: 'PBKDF2' }, false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64ToBytes(stageData.salt), iterations: PBKDF2_ITERATIONS, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    const plainBuf = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64ToBytes(stageData.iv) },
      key,
      b64ToBytes(stageData.ciphertext)
    );
    return new TextDecoder().decode(plainBuf);
  }

  const FINAL_TITLE = "You're in.";
  const FINAL_MESSAGE = "[Cliquez ici](https://canva.link/lwssr9no1ktt7d2)";

  // ------------------------------------------------------------------
  // Everything below this line runs the page. No need to edit it.
  // ------------------------------------------------------------------


  let stage = 0;              // number of doors successfully opened
  let awaitingContinue = false; // true right after a correct entry, before player clicks "Next door"
  let viewingIndex = null;     // set when player is looking back at an already-opened door
  const decryptedClues = [];   // filled in as doors are opened — nothing here until it's earned

  const stageTrack = document.getElementById('stageTrack');
  const passForm = document.getElementById('passForm');
  const passInput = document.getElementById('passInput');
  const feedback = document.getElementById('feedback');
  const seal = document.getElementById('seal');
  const noteBox = document.getElementById('noteBox');
  const noteText = document.getElementById('noteText');
  const noteEyebrow = document.getElementById('noteEyebrow');
  const continueBtn = document.getElementById('continueBtn');
  const backBtn = document.getElementById('backBtn');
  const promptLabel = document.getElementById('promptLabel');
  const subtitle = document.getElementById('subtitle');
  const clubTitle = document.getElementById('clubTitle');
  const hintArea = document.getElementById('hintArea');
  const hintToggle = document.getElementById('hintToggle');
  const hintText = document.getElementById('hintText');

  function renderTrack(){
    stageTrack.innerHTML = '';
    STAGES.forEach((_, i) => {
      const tab = document.createElement('div');
      const isDone = i < stage;
      const isCurrent = i === stage;
      tab.className = 'tab' + (isDone ? ' done' : isCurrent ? ' current' : ' locked');
      tab.textContent = 'Code ' + (i + 1);
      if (isDone){
        tab.title = 'Click to re-read this clue';
        tab.addEventListener('click', function(){
          viewingIndex = i;
          render();
        });
      } else if (isCurrent){
        tab.title = viewingIndex !== null ? 'Back to where you are' : 'You are here';
        tab.addEventListener('click', function(){
          viewingIndex = null;
          render();
        });
      } else {
        tab.title = 'Not unlocked yet';
      }
      stageTrack.appendChild(tab);
    });
  }

  // Single function that decides what's on screen based on the current state.
  function render(){
    renderTrack();
    const isFinal = stage >= STAGES.length;

    if (viewingIndex !== null){
      // Reviewing a past door — read only, doesn't touch game progress.
      noteEyebrow.textContent = 'Indice ' + (viewingIndex + 1);
      renderClue(decryptedClues[viewingIndex]);
      noteBox.classList.add('shown');
      seal.classList.add('cracked');
      passForm.style.display = 'none';
      continueBtn.style.display = 'none';
      backBtn.style.display = 'inline-block';
      return;
    }

    backBtn.style.display = 'none';

    if (awaitingContinue){
      noteEyebrow.textContent = isFinal ? 'BRAVO!!!' : 'Indice ' + stage;
      renderClue(isFinal ? FINAL_MESSAGE : decryptedClues[stage - 1]);
      noteBox.classList.add('shown');
      seal.classList.add('cracked');
      passForm.style.display = 'none';
      continueBtn.style.display = isFinal ? 'none' : 'inline-block';
      return;
    }

    // Live: waiting for the next password.
    noteBox.classList.remove('shown');
    seal.classList.remove('cracked');
    passForm.style.display = 'block';
    continueBtn.style.display = 'none';
    passInput.value = '';
    feedback.textContent = '';
    passInput.focus();

    const hint = STAGES[stage] && STAGES[stage].hint;
    hintText.style.display = 'none';
    hintToggle.textContent = "Indice";
    hintArea.style.display = hint ? 'block' : 'none';
  }

  function renderClue(text) {
    noteText.innerHTML = text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
      )
      .replace(/\n/g, '<br>');
  }

  const submitBtn = passForm.querySelector('button[type="submit"]');

  passForm.addEventListener('submit', async function(e){
    e.preventDefault();
    const guess = passInput.value.trim().toLowerCase();
    if (guess.length === 0) return;

    submitBtn.disabled = true;
    submitBtn.textContent = '...';
    feedback.textContent = '';

    try {
      const clue = await tryUnlock(STAGES[stage], guess);
      decryptedClues[stage] = clue;
      stage += 1;
      awaitingContinue = true;
      if (stage >= STAGES.length){
        clubTitle.textContent = FINAL_TITLE;
        subtitle.textContent = 'The night is yours';
      }
      render();
    } catch (err) {
      feedback.textContent = "Nerd 😂 Essaie encore.";
      passInput.classList.remove('shake');
      void passInput.offsetWidth;
      passInput.classList.add('shake');
    }

    submitBtn.disabled = false;
    submitBtn.textContent = 'Enter';
  });

  continueBtn.addEventListener('click', function(){
    awaitingContinue = false;
    promptLabel.textContent = 'Password';
    render();
  });

  hintToggle.addEventListener('click', function(){
    const isShown = hintText.style.display === 'block';
    hintText.style.display = isShown ? 'none' : 'block';
    hintText.textContent = STAGES[stage].hint;
    hintToggle.textContent = isShown ? "Indice" : "Cacher l'indice";
  });

  backBtn.addEventListener('click', function(){
    viewingIndex = null;
    render();
  });

  // Phones don't reflow the page when the on-screen keyboard opens, so
  // without this the keyboard can simply cover the input. Adding bottom
  // padding while typing gives the page room to scroll to, and
  // scrollIntoView nudges the input above the keyboard.
  passInput.addEventListener('focus', function(){
    document.body.classList.add('keyboard-open');
    setTimeout(function(){
      passInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 300);
  });
  passInput.addEventListener('blur', function(){
    document.body.classList.remove('keyboard-open');
  });

  render();

</script>
</body>
</html>
